# Connexion à la base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/job_db
spring.datasource.username=job_user
spring.datasource.password=***REMOVED***

# Configuration JPA
spring.jpa.hibernate.ddl-auto=update
# Afficher les requêtes SQL générées par Hibernate dans la console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Configuration du dialecte PostgreSQL pour Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuration de l'ia
spring.ai.google.genai.api-key=***REMOVED***
spring.ai.google.genai.chat.options.model=gemini-3.8-flash

# Configuration JWT
# Clé secrète (doit être longue et complexe en production)
security.jwt.secret-key=***REMOVED***
# Expiration du token en millisecondes (Ici : 24 heures)
security.jwt.expiration-time=86400000