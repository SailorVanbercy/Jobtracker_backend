# Variables locales chargées depuis .env (ignoré par git, voir .env.example).
# Les vraies variables d'environnement restent prioritaires.
spring.config.import=optional:file:.env[.properties]

# Connexion à la base de données PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuration JPA
spring.jpa.hibernate.ddl-auto=update
# Afficher les requêtes SQL générées par Hibernate dans la console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Configuration du dialecte PostgreSQL pour Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuration de l'ia
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}

# Configuration JWT
# Clé secrète encodée en Base64 (>= 256 bits)
security.jwt.secret-key=${JWT_SECRET_KEY}
# Expiration du token en millisecondes (par défaut : 24 heures)
security.jwt.expiration-time=${JWT_EXPIRATION_MS:86400000}
# Cookie "Secure" (HTTPS uniquement) : true en production
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# CORS : origines autorisées, séparées par des virgules
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
